name: CI

# Runs on every branch and pull request. Nothing here deploys anything.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (unit + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        env:
          # A throwaway database that exists only for this job.
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: pytest -q -rs

  docker:
    name: Docker image builds and imports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag ai-photo-sharing:ci .

      - name: Import the app and the face-model stack inside the image
        run: >-
          docker run --rm -e TESTING=true ai-photo-sharing:ci
          python -c "import cv2, insightface, onnxruntime, numpy;
          from backend.app import app;
          print('image ok:', 'insightface', insightface.__version__, '| onnxruntime', onnxruntime.__version__, '| numpy', numpy.__version__)"

      - name: Image does not run as root
        run: test "$(docker run --rm ai-photo-sharing:ci id -u)" = "1000"
