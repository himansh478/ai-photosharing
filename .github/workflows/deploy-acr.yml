name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_NAME: cwayaacr
  IMAGE_NAME: ai-photo-sharing
  RESOURCE_GROUP: cwaya-ai-prod
  WEBAPP_NAME: cwaya-ai-share

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run failing test (debug)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q -k test_verify_code_valid -s
        # Temporary: run only failing test with -s for debug; revert after fix
        # If tests fail the job will stop here and image will not be built

      - name: Build and Push Image (ACR)
        run: |
          az acr build --registry "$ACR_NAME" --image "$IMAGE_NAME:latest" --file azure.Dockerfile .

      - name: Restart Web App
        run: |
          az webapp restart --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP"
